<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нет соединения — ВидеоПеревод</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d0f0e;
    color: #e6e6e6;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 84px;
    height: 84px;
    margin: 0 auto 24px;
    border-radius: 22px;
    background: linear-gradient(180deg, #10b981, #064e3b);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 40px rgba(16, 185, 129, 0.25);
  }
  .icon svg { width: 44px; height: 44px; }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.55; color: #9ca3af; margin-bottom: 28px; }
  a {
    display: inline-block;
    background: #059669;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 28px;
    border-radius: 10px;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <h1>Нет соединения</h1>
    <p>Для перевода видео нужен интернет. Проверьте сеть и откройте приложение снова — история переводов сохранится на сервере.</p>
    <a href="/">Попробовать ещё раз</a>
  </main>
</body>
</html>
